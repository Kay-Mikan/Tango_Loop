<script>
(function(){
'use strict';

/* ==SCHED-START== */
const MIN=60000,HOUR=3600000,DAY=86400000,ROLL=4;
const LEARN=[1,10],RELEARN=[10],GRAD_IV=1,EASY_IV=4,LEARN_AHEAD=20*MIN,MAXIV=36500;
function dayStart(t){const d=new Date(t-ROLL*HOUR);d.setHours(ROLL,0,0,0);return d.getTime();}
function addDays(ts,n){const d=new Date(ts);d.setDate(d.getDate()+n);return d.getTime();}
function pad(n){return n<10?'0'+n:''+n;}
function dayKey(t){const d=new Date(dayStart(t));return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
/* card.s: 0 new, 1 learning, 2 review, 3 relearning. rating r: 1 again, 2 hard, 3 good, 4 easy */
function sched(c,r,now){
  const n=Object.assign({},c);
  const today=dayStart(now);
  if(c.s===2){
    const ef=c.ef||2.5;
    if(r===1){
      n.lp=(c.lp||0)+1;n.ef=Math.max(1.3,ef-.2);n.iv=1;n.s=3;n.st=0;n.due=now+RELEARN[0]*MIN;
    }else{
      const hard=Math.max(c.iv+1,Math.round(c.iv*1.2));
      const good=Math.max(hard+1,Math.round(c.iv*ef));
      const easy=Math.max(good+1,Math.round(c.iv*ef*1.3));
      let iv;
      if(r===2){iv=hard;n.ef=Math.max(1.3,ef-.15);}
      else if(r===3){iv=good;}
      else{iv=easy;n.ef=ef+.15;}
      n.iv=Math.min(MAXIV,iv);n.due=addDays(today,n.iv);
    }
    return n;
  }
  const relearn=c.s===3;
  const steps=relearn?RELEARN:LEARN;
  const st=c.s===0?0:c.st;
  const keep=relearn?3:1;
  const grad=function(iv){n.s=2;n.st=0;n.iv=iv;n.due=addDays(today,iv);};
  if(r===1){n.s=keep;n.st=0;n.due=now+steps[0]*MIN;}
  else if(r===2){
    const m=(st===0&&steps.length>1)?(steps[0]+steps[1])/2:steps[Math.min(st,steps.length-1)];
    n.s=keep;n.st=st;n.due=now+m*MIN;
  }else if(r===3){
    if(st+1<steps.length){n.s=keep;n.st=st+1;n.due=now+steps[n.st]*MIN;}
    else grad(relearn?Math.max(1,c.iv):GRAD_IV);
  }else{
    grad(relearn?Math.max(1,c.iv)+1:EASY_IV);
  }
  return n;
}
function fmtDays(d){
  if(d<30)return d+'日';
  if(d<365)return (Math.round(d/30*10)/10)+'か月';
  return (Math.round(d/365*10)/10)+'年';
}
function fmtNext(n,now){
  if(n.s===1||n.s===3){
    const m=Math.max(1,Math.round((n.due-now)/MIN));
    return m<60?m+'分':Math.round(m/60)+'時間';
  }
  return fmtDays(n.iv);
}
function inDeck(c,deck){if(!deck)return true;if(typeof deck==='function')return deck(c);return c.d===deck;}
function queueCounts(cards,deck,newLeft,now){
  const eod=addDays(dayStart(now),1),ahead=now+LEARN_AHEAD;
  let nw=0,lr=0,rv=0;
  for(const c of cards){
    if(!inDeck(c,deck))continue;
    if(c.s===0)nw++;
    else if(c.s===2){if(c.due<eod)rv++;}
    else if(c.due<=ahead)lr++;
  }
  return {nw:Math.min(nw,Math.max(0,newLeft)),lr:lr,rv:rv};
}
function pickCard(cards,deck,newLeft,now){
  const eod=addDays(dayStart(now),1),ahead=now+LEARN_AHEAD;
  let learnNow=null,learnSoon=null,firstNew=null;const revs=[];
  for(const c of cards){
    if(!inDeck(c,deck))continue;
    if(c.s===1||c.s===3){
      if(c.due<=now){if(!learnNow||c.due<learnNow.due)learnNow=c;}
      else if(c.due<=ahead){if(!learnSoon||c.due<learnSoon.due)learnSoon=c;}
    }else if(c.s===2){if(c.due<eod)revs.push(c);}
    else if(!firstNew)firstNew=c;
  }
  if(learnNow)return learnNow;
  if(revs.length)return revs[Math.floor(Math.random()*revs.length)];
  if(firstNew&&newLeft>0)return firstNew;
  return learnSoon;
}
/* ==SCHED-END== */

/* ---------- helpers ---------- */
function h(tag,props){
  const e=document.createElement(tag);
  if(props)for(const k in props){
    const v=props[k];
    if(v==null||v===false)continue;
    if(k==='class')e.className=v;
    else if(k==='text')e.textContent=v;
    else if(k==='style')e.style.cssText=v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2).toLowerCase(),v);
    else if(v===true)e.setAttribute(k,'');
    else e.setAttribute(k,v);
  }
  const kids=Array.prototype.slice.call(arguments,2);
  for(const c of kids.flat()){
    if(c==null||c===false)continue;
    e.append(c.nodeType?c:document.createTextNode(String(c)));
  }
  return e;
}

let voices=[];
function loadVoices(){
  if(!TTS)return;
  try{voices=speechSynthesis.getVoices().filter(function(v){return /^en([-_]|$)/i.test(v.lang);});}catch(e){voices=[];}
}
function vLang(v){return v.lang.replace('_','-');}
function bestVoice(){
  const sel=S.settings.voiceURI;
  if(sel){const v=voices.find(function(x){return x.voiceURI===sel;});if(v)return v;}
  const want=S.settings.accent==='uk'?'en-GB':'en-US';
  const score=function(v){
    let s=0;
    if(vLang(v)===want)s+=10;
    if(/natural|neural|premium|enhanced|online/i.test(v.name))s+=4;
    if(/google/i.test(v.name))s+=2;
    if(/samantha|ava|allison|daniel|serena|karen|alex/i.test(v.name))s+=1;
    return s;
  };
  let best=null,bs=-1;
  for(const v of voices){const s=score(v);if(s>bs){bs=s;best=v;}}
  return best;
}
function speak(t){
  if(!TTS||!t)return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t),v=bestVoice();
    if(v){u.voice=v;u.lang=vLang(v);}else u.lang=S.settings.accent==='uk'?'en-GB':'en-US';
    u.rate=S.settings.rate||.9;
    speechSynthesis.speak(u);
  }catch(e){}
}
function esc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
function deckNames(){
  const seen=[];
  for(const c of S.cards)if(seen.indexOf(c.d)<0)seen.push(c.d);
  for(const d of S.decks)if(seen.indexOf(d)<0)seen.push(d);

}

function exNode(text,word){
  if(!text)return null;
  const m=word?new RegExp(esc(word)+'\\w*','i').exec(text):null;
  if(!m)return document.createTextNode(text);
  const f=document.createDocumentFragment();
  f.append(text.slice(0,m.index),h('mark',null,m[0]),text.slice(m.index+m[0].length));
  return f;
}

function thumb(c){const d=S.imgs[c.id];return d?h('img',{class:'thumb',src:d,alt:'',loading:'lazy'}):null;}
function readImage(file,cb){
  if(!file)return;
  if(!/^image\//.test(file.type||'')){toast('画像ファイルを選んでください');return;}
  const fr=new FileReader();
  fr.onerror=function(){toast('画像を読み込めませんでした');};
  fr.onload=function(){
    const im=new Image();
    im.onerror=function(){toast('この画像形式は読み込めません');};
    im.onload=function(){
      const M=320,sc=Math.min(1,M/Math.max(im.width,im.height));
      const w=Math.max(1,Math.round(im.width*sc)),hh=Math.max(1,Math.round(im.height*sc));
      const cv=document.createElement('canvas');cv.width=w;cv.height=hh;
      const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,w,hh);cx.drawImage(im,0,0,w,hh);
      let out='';
      try{out=cv.toDataURL('image/jpeg',0.72);}catch(e){}
      if(!out||out.length<30){toast('画像を変換できませんでした');return;}
      cb(out);
    };
    im.src=fr.result;
  };
  fr.readAsDataURL(file);
}
function picField(init,onchange){
  let cur=init||'';
  const box=h('div',{class:'field'});
  const file=h('input',{type:'file',accept:'image/*',hidden:true,'aria-label':'画像ファイル'});
  file.addEventListener('change',function(){
    const f=file.files&&file.files[0];
    readImage(f,function(d){cur=d;onchange(d);draw();});
    file.value='';
  });
  function draw(){
    box.replaceChildren(
      h('span',{class:'lbl'},'絵(任意)'),
      cur?h('img',{class:'pic-prev',src:cur,alt:'選んだ画像'}):null,
      h('div',{class:'row'},
        h('button',{class:'btn sm',type:'button',onclick:function(){file.click();}},cur?'画像を変更':'画像を選ぶ'),
        cur?h('button',{class:'btn sm danger',type:'button',onclick:function(){cur='';onchange('');draw();}},'画像を外す'):null,
        file),
      h('span',{class:'muted small'},'自動で小さく縮小して保存します。'));
  }
  draw();
  return {node:box,reset:function(){cur='';draw();}};
}

/* ---------- cards ---------- */
function mkCard(w,m,x,d,e,p){
  lastC=Math.max(Date.now(),lastC+1);
  return {id:rid(),w:w,m:m,x:x||'',e:e||'',p:normP(p),d:d,s:0,st:0,due:0,iv:0,ef:2.5,lp:0,c:lastC,pg:0};
}
function addCard(card){
  let max=0;
  for(const c of S.cards)if(c.pg>max)max=c.pg;
  let n=0;
  for(const c of S.cards)if(c.pg===max)n++;
  card.pg=n>=PAGE?max+1:max;
  S.cards.push(card);
  dirty.pages.add(card.pg);
}
function hasDup(w,d){
  const k=w.trim().toLowerCase();
  return S.cards.some(function(c){return c.d===d&&c.w.trim().toLowerCase()===k;});
}
function seedSample(){
  for(const r of SAMPLE)addCard(mkCard(r[0],r[1],r[2],SAMPLE_DECK));
  S.seeded=true;dirty.meta=true;
}

function setStat(s){
  stat=s;
  const el=document.getElementById('chip');
  if(el){el.dataset.s=s;el.textContent=statText();}
}
function statText(){
  return {saved:mode==='cloud'?'保存済み':'この端末に保存',saving:'保存中…',local:'この端末に保存',error:'保存できません'}[stat]||'';
}
function metaDoc(){
  const keys=Object.keys(S.days).sort();
  while(keys.length>400)delete S.days[keys.shift()];
  return {v:1,settings:S.settings,days:S.days,seeded:S.seeded,decks:S.decks};
}
function scheduleSave(){
  pruneImgs();
  clearTimeout(saveTimer);
  setStat('saving');
  saveTimer=setTimeout(flush,500);
}
async function flush(){
  clearTimeout(saveTimer);
  if(saving){again=true;return;}
  saving=true;
  try{
    if(mode==='cloud'){
      const pages=Array.from(dirty.pages),meta=dirty.meta,imgIds=Array.from(dirty.imgs);dirty.imgs.clear();
      dirty.pages.clear();dirty.meta=false;
      for(const p of pages)await coll.doc('p'+p).set({cards:S.cards.filter(function(c){return c.pg===p;})});
      for(const id of imgIds)await coll.doc('i_'+id).set({d:S.imgs[id]||''});
      if(meta)await coll.doc('meta').set(metaDoc());
      setStat('saved');
    }else{
      localStorage.setItem(LSKEY,JSON.stringify(S));
      dirty.pages.clear();dirty.meta=false;dirty.imgs.clear();
      setStat('local');
    }
  }catch(e){
    if(mode==='cloud'){
      mode='local';
      try{localStorage.setItem(LSKEY,JSON.stringify(S));setStat('local');toast('クラウドに保存できなかったため、この端末に保存します');}
      catch(e2){setStat('error');}
    }else{setStat('error');toast('保存できません。画像を減らしてください');}
  }finally{
    saving=false;
    if(again){again=false;flush();}
  }
}
function withTimeout(p,ms){
  return Promise.race([p,new Promise(function(_,rej){setTimeout(function(){rej(new Error('timeout'));},ms);})]);
}
function loadLocal(){
  let raw=null;
  try{raw=localStorage.getItem(LSKEY);}catch(e){}
  if(!raw)return false;
  try{
    const o=JSON.parse(raw);
    S.cards=o.cards||[];Object.assign(S.settings,o.settings||{});S.days=o.days||{};S.seeded=!!o.seeded;S.decks=o.decks||[];S.imgs=o.imgs||{};
    return true;
  }catch(e){return false;}
}
async function initStorage(){
  let db=null;
  try{
    if(window.claude&&window.claude.use){
      const user=await window.claude.use('user');
      uid=user?await user.id():null;
      db=uid?await window.claude.use('db'):null;
    }
  }catch(e){db=null;}
  if(db&&uid){
    try{
      coll=db.collection('data/users/'+uid);
      const snap=await withTimeout(coll.get(),10000);
      const pages=[];let meta=null;const imgs={};
      snap.docs.forEach(function(d){
        if(!d.exists)return;
        const data=d.data()||{};
        if(d.id==='meta')meta=JSON.parse(JSON.stringify(data));
        else if(/^p\d+$/.test(d.id))pages.push([parseInt(d.id.slice(1),10),data.cards||[]]);
        else if(/^i_/.test(d.id)){if(data.d)imgs[d.id.slice(2)]=data.d;}
      });
      pages.sort(function(a,b){return a[0]-b[0];});
      S.cards=[];S.imgs=imgs;
      for(const p of pages)for(const c of p[1]){const cc=Object.assign({},c);cc.pg=p[0];S.cards.push(cc);}
      if(meta){Object.assign(S.settings,meta.settings||{});S.days=meta.days||{};S.seeded=!!meta.seeded;S.decks=meta.decks||[];}
      for(const c of S.cards)if(c.c>lastC)lastC=c.c;
      mode='cloud';
      if(!meta&&!pages.length&&!snap.metadata.fromCache){seedSample();scheduleSave();}
      else setStat('saved');
      return;
    }catch(e){coll=null;}
  }
  mode='local';
  const had=loadLocal();
  for(const c of S.cards)if(c.c>lastC)lastC=c.c;
  if(!had){seedSample();scheduleSave();}
  else setStat('local');
}

/* ---------- study flow ---------- */
function studyNL(now){return study&&study.free?9999:newLeft(now);}
function startStudy(deck,label,free){
  study={deck:deck,label:label||'',free:!!free,card:null,shown:false,done:0,undo:[]};
  study.card=pickCard(S.cards,deck,studyNL(Date.now()),Date.now());
  view='study';render();
}
function showAnswer(){
  if(!study||!study.card)return;
  study.shown=true;render();
  if(S.settings.autoSpeak){speak(study.card.w);}
}
function rate(r){
  if(!study||!study.card||!study.shown)return;
  const c=study.card,now=Date.now(),dk=dayKey(now);
  study.undo.push({prev:Object.assign({},c),dk:dk,day:S.days[dk]?Object.assign({},S.days[dk]):null});
  if(study.undo.length>30)study.undo.shift();
  const n=sched(c,r,now);
  n.lr=r;
  const day=S.days[dk]||(S.days[dk]={n:0,r:0,a:0});
  if(c.s===0)day.n=(day.n||0)+1;
  day.r=(day.r||0)+1;
  if(r===1)day.a=(day.a||0)+1;
  Object.assign(c,n);
  dirty.pages.add(c.pg);dirty.meta=true;scheduleSave();
  study.done++;
  study.card=pickCard(S.cards,study.deck,studyNL(now),now);
  study.shown=false;
  render();
}
function undo(){
  if(!study||!study.undo.length)return;
  const u=study.undo.pop();
  const card=S.cards.find(function(c){return c.id===u.prev.id;});
  if(!card)return;
  Object.assign(card,u.prev);
  card.lr=u.prev.lr||0;
  if(u.day)S.days[u.dk]=u.day;else delete S.days[u.dk];
  study.done=Math.max(0,study.done-1);
  study.card=card;study.shown=false;
  dirty.pages.add(card.pg);dirty.meta=true;scheduleSave();
  render();
}

function nav(){

function render(){
  applyPrefs();
  const parts=[header()];
  if(view!=='study'&&view!=='memo')parts.push(nav());
  let main;
  if(view==='study'&&study)main=studyView();
  else if(view==='memo'&&memo)main=memoView();
  else{
    if(view==='study'||view==='memo')view='home';
    main={home:homeView,add:addView,browse:browseView,stats:statsView,settings:settingsView}[view]();
  }
  parts.push(main);
  root.replaceChildren.apply(root,parts);
  if(view==='browse')renderList();
}

/* ---------- memorize mode: English + picture as a set ---------- */
let memo=null;
function memoList(deck,scope){
  return S.cards.filter(function(c){
    if(!inDeck(c,deck))return false;
    if(scope==='new')return c.s===0;
    if(scope==='pic')return !!S.imgs[c.id];
    return true;
  });
}
function memoApply(){
  memo.ids=memoList(memo.deck,memo.scope).map(function(c){return c.id;});
  memo.i=0;memo.done=false;
}
function memoCard(){
  if(!memo||!memo.ids.length)return null;
  const id=memo.ids[memo.i];
  return S.cards.find(function(c){return c.id===id;})||null;
}
function memoSpeak(){
  const c=memoCard();
  if(S.settings.autoSpeak&&c&&memo&&!memo.done)speak(c.w);
}
function startMemo(deck,label,pick){
  memo={deck:deck,label:label||'',free:!!pick,scope:(!pick&&memoList(deck,'new').length)?'new':'all',ids:[],i:0,done:false};

function renderList(){

  const rows=S.cards.filter(function(c){

  });
  if(sortKey!=='old')rows.reverse();

      h('button',{class:'btn sm primary',type:'button',disabled:!n,onclick:function(){
        const ids=new Set(selected);startStudy(function(c){return ids.has(c.id);},'選んだ'+ids.size+'枚',true);
      }},'選んだ'+n+'枚を練習'),
      h('button',{class:'btn sm danger',type:'button',disabled:!n,onclick:function(){
        arm('bulk',function(){

}
function cardRow(c,now){
  if(selectMode){
    const cb=h('input',{type:'checkbox',class:'pick','aria-label':c.w+' を選択',checked:selected.has(c.id)});
    const li=h('li',{class:'item pickable'+(selected.has(c.id)?' sel':'')},
      cb,
      h('div',{class:'item-main',style:'flex:1'},h('div',{class:'item-w'},c.w),phon(c)?h('div',{class:'item-p'},phon(c)):null,h('div',{class:'item-m'},c.m),c.x?h('div',{class:'item-x'},c.x):null,c.e?h('div',{class:'item-e'},'語源: '+c.e):null),
      h('div',{class:'item-side'},
        h('span',{class:'badge s'+c.s},statusLabel(c,now)),
        c.lr?h('span',{class:'badge lr'+c.lr},RATE_NAMES[c.lr-1]):null,
        h('span',null,c.d)));
    const toggle=function(){
      if(selected.has(c.id))selected.delete(c.id);else selected.add(c.id);
      cb.checked=selected.has(c.id);li.classList.toggle('sel',cb.checked);
      armedKey=null;clearTimeout(armedTimer);renderBulk();
    };
    cb.addEventListener('change',toggle);
    li.addEventListener('click',function(e){if(e.target===cb)return;toggle();});
    return li;
  }
  return h('li',{class:'item'},
    h('div',{class:'item-main'},h('div',{class:'item-w'},c.w),phon(c)?h('div',{class:'item-p'},phon(c)):null,h('div',{class:'item-m'},c.m),c.x?h('div',{class:'item-x'},c.x):null,c.e?h('div',{class:'item-e'},'語源: '+c.e):null),
    h('div',{class:'item-side'},
      h('span',{class:'badge s'+c.s},statusLabel(c,now)),

      h('span',null,c.d),
      h('div',{class:'row',style:'justify-content:flex-end'},
        h('button',{class:'btn sm',type:'button',onclick:function(){editingId=c.id;editImg=S.imgs[c.id]||'';renderList();}},'編集'),
        h('button',{class:'btn sm danger',type:'button','aria-label':c.w+' を削除',onclick:function(){
          const key='card:'+c.id;
          arm(key,function(){
            S.cards=S.cards.filter(function(x){return x.id!==c.id;});
            dirty.pages.add(c.pg);scheduleSave();toast('削除しました');renderList();
          },renderList);
        }},armedKey==='card:'+c.id?'本当に削除':'削除'))));
}

function statsView(){
  const now=Date.now(),t0=dayStart(now),tk=dayKey(now),day=S.days[tk]||{n:0,r:0,a:0};
  let streak=0;
  let i=day.r>0?0:1;
  while(i<400){const dd=S.days[dayKey(addDays(t0,-i))];if(dd&&dd.r>0){streak++;i++;}else break;}
  let r30=0,a30=0;
  for(let k=0;k<30;k++){const dd=S.days[dayKey(addDays(t0,-k))];if(dd){r30+=dd.r||0;a30+=dd.a||0;}}
  const mature=S.cards.filter(function(c){return c.s===2&&c.iv>=21;}).length;
  const learned=S.cards.filter(function(c){return c.s!==0;}).length;
  const tiles=h('div',{class:'tiles'},
    tile(day.r||0,'今日の練習(回)'),
    tile(streak+'日','連続練習'),
    tile(S.cards.length,'カード総数'),
    tile(learned,'学習を始めた数'),
    tile(mature,'定着(21日以上)'),
    tile(r30?Math.round((r30-a30)/r30*100)+'%':'—','正答率(30日)'));
  const fc=forecast(now);
  const fLabels=fc.map(function(_,k){return k===0?'今日':k===1?'明日':WK[new Date(addDays(t0,k)).getDay()];});
  const hist=[],hLabels=[];
  for(let k=13;k>=0;k--){const dd=S.days[dayKey(addDays(t0,-k))];hist.push(dd?dd.r||0:0);hLabels.push(String(new Date(addDays(t0,-k)).getDate()));}
  return h('div',{class:'stack'},tiles,
    h('section',{class:'panel'},h('h2',null,'今後7日の復習予定'),bars(fc,fLabels),h('p',{class:'muted small'},'復習カードの枚数です。今日の分には遅れているカードも含みます。')),
    h('section',{class:'panel'},h('h2',null,'過去14日の練習回数'),bars(hist,hLabels),h('p',{class:'muted small'},'横軸は日付(日)です。')));
}
function tile(v,l){return h('div',{class:'tile'},h('b',null,v),h('span',null,l));}
function bars(vals,labels){
  const max=Math.max(1,Math.max.apply(null,vals));
  return h('div',{class:'bars-wrap'},
    h('div',{class:'bars'},vals.map(function(v){
      const pct=Math.round(v/max*88);
      return h('div',{class:'bar'},h('div',{class:'col'},h('div',{class:'val',style:'--h:'+pct},v>0?v:''),h('div',{class:'fill'+(v===0?' zero':''),style:'--h:'+pct})));
    })),
    h('div',{class:'xrow'},labels.map(function(l){return h('div',{class:'xl'},l);})));
}

          h('select',{id:'set-rate',onchange:function(e){S.settings.rate=parseFloat(e.target.value)||0.9;dirty.meta=true;scheduleSave();}},
            h('option',{value:'0.7',selected:Math.abs((S.settings.rate||0.9)-0.7)<0.01},'ゆっくり'),
            h('option',{value:'0.9',selected:Math.abs((S.settings.rate||0.9)-0.9)<0.01},'ふつう'),
            h('option',{value:'1.1',selected:Math.abs((S.settings.rate||0.9)-1.1)<0.01},'速い')))),
      h('div',{class:'field'},h('label',{class:'lbl',for:'set-voice'},'声'),
        h('select',{id:'set-voice',onchange:function(e){S.settings.voiceURI=e.target.value;dirty.meta=true;scheduleSave();}},
          h('option',{value:''},'おまかせ(聞き取りやすい声を自動で選ぶ)'),
          voices.map(function(v){const o=h('option',{value:v.voiceURI,selected:S.settings.voiceURI===v.voiceURI});o.textContent=v.name+' ('+vLang(v)+')';return o;}))),
      voices.length?null:h('p',{class:'muted small'},'この端末で使える英語の音声が見つかりません。端末の設定で英語の音声を追加すると、ここに表示されます。'),
      h('div',null,h('button',{class:'btn sm',type:'button',onclick:function(){speak('The quick brown fox jumps over the lazy dog.');}},'試しに聞く'))):null,
    h('section',{class:'panel'},h('h2',null,'カードの見た目'),
      h('div',{class:'grid2'},
        h('div',{class:'field'},h('label',{class:'lbl',for:'set-font'},'英単語の書体'),
          h('select',{id:'set-font',onchange:function(e){S.settings.cardFont=e.target.value;applyPrefs();dirty.meta=true;scheduleSave();}},
            h('option',{value:'hyper',selected:S.settings.cardFont==='hyper'},'読みやすさ重視(Atkinson Hyperlegible)'),
            h('option',{value:'sans',selected:S.settings.cardFont==='sans'},'標準のゴシック(Inter)'),
            h('option',{value:'serif',selected:S.settings.cardFont==='serif'},'セリフ体(Source Serif)'))),
        h('div',{class:'field'},h('label',{class:'lbl',for:'set-size'},'文字サイズ'),
          h('select',{id:'set-size',onchange:function(e){S.settings.cardSize=e.target.value;applyPrefs();dirty.meta=true;scheduleSave();}},
            h('option',{value:'s',selected:S.settings.cardSize==='s'},'小'),
            h('option',{value:'m',selected:S.settings.cardSize==='m'},'標準'),
            h('option',{value:'l',selected:S.settings.cardSize==='l'},'大')))),
      h('div',{class:'card',style:'min-height:0;padding:20px 16px;gap:10px'},
        h('div',{class:'word'},'reluctant'),
        h('div',{class:'ja'},'気が進まない'),
        h('div',{class:'ex'},exNode('She was reluctant to speak in public.','reluctant')))),
    h('section',{class:'panel'},h('h2',null,'保存先'),
      h('p',{class:'muted'},mode==='cloud'
        ?'学習の進み具合はアカウントに保存されます。同じアカウントでこのページを開けば、別の端末でも続きから学習できます。'
        :'学習の進み具合はこの端末のブラウザにだけ保存されています。ブラウザのデータを消すと失われるので、時々書き出しておくと安心です。')),

      h('div',{class:'row'},
        h('button',{class:'btn sm',type:'button',onclick:function(){
          exportText=S.cards.map(function(c){return [c.w,c.m,c.x||'',(c.e||'').replace(/\s+/g,' '),phon(c),c.d].join('\t');}).join('\n');
          exp.value=exportText;exp.hidden=false;exp.focus();exp.select();

        h('button',{class:'btn sm',type:'button',onclick:function(){

/* ---------- global events ---------- */
document.addEventListener('keydown',function(e){
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(view==='memo'&&memo){
    const t1=e.target;
    if(t1&&(/^(INPUT|TEXTAREA|SELECT)$/.test(t1.tagName)||t1.isContentEditable))return;
    if((e.key===' '||e.key==='Enter')&&t1&&t1.tagName==='BUTTON')return;
    if(memo.done||!memo.ids.length)return;
    if(e.key==='ArrowRight'||e.key===' '||e.key==='Enter'){e.preventDefault();memoGo(1);}
    else if(e.key==='ArrowLeft'){e.preventDefault();memoGo(-1);}
    return;
  }
  if(view!=='study'||!study)return;
  const t=e.target;
  if(t&&(/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)||t.isContentEditable))return;
  if(e.key==='z'||e.key==='Z'){undo();return;}
  if(!study.card)return;
  if(!study.shown){
    if(e.key===' '||e.key==='Enter'){e.preventDefault();showAnswer();}
  }else{
    if(e.key>='1'&&e.key<='4'){e.preventDefault();rate(parseInt(e.key,10));}
    else if(e.key===' '||e.key==='Enter'){e.preventDefault();rate(3);}
  }
});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden'&&(dirty.meta||dirty.pages.size||dirty.imgs.size))flush();});
window.addEventListener('pagehide',function(){if(dirty.meta||dirty.pages.size||dirty.imgs.size)flush();});

/* ---------- boot ---------- */
if(TTS){
  loadVoices();
  try{speechSynthesis.addEventListener('voiceschanged',function(){const n=voices.length;loadVoices();if(view==='settings'&&voices.length!==n)render();});}catch(e){}
}
root.replaceChildren(header(),h('p',{class:'muted'},'読み込み中…'));
initStorage().then(render,function(){mode='local';render();});
})();
